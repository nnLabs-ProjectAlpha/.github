name: Task or feature
description: A piece of work to be done.
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist a reviewer can verify.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links to designs in design-ref, constraints, dependencies.

name: Bug
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fake data only. Never paste secrets or real customer data.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Repository path, page or component.
